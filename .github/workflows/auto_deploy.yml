name: Auto Deploy

on:
    # push:
    #     branches:
    #         - main
    # pull_request:
    #     branches:
    #         main
    #     types: [closed]
    workflow_dispatch:
jobs:
    # バージョンは src/flaretool/VERSION.py を手動で更新する運用
    # （自動パッチインクリメントは v0.3.0 で廃止）
    update-docs:
        uses: ./.github/workflows/deploy_page.yml
    deploy-prod:
        needs: update-docs
        uses: ./.github/workflows/deploy_prod.yml
        secrets:
            PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    update-tag:
        needs: deploy-prod
        uses: ./.github/workflows/tag_update_prod.yml
    merge-develop:
        needs: update-tag
        uses: ./.github/workflows/recreate_develop_branch.yml
