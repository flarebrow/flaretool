name: Run pytest
on:
    workflow_dispatch:
    repository_dispatch:
        types:
        - pytest
    workflow_call:
    push:
        branches:
        - develop
        - main

jobs:
  pytest:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    permissions: write-all

    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Pythonの環境をセットアップ
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      # 依存関係をインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt

      # pytest -> JUnit xml形式で結果を出力
      - name: PyTest
        run: |
          set -o pipefail
          pytest tests --junit-xml results/pytest.xml --disable-warnings --cov=src/ --cov-report=term-missing:skip-covered | tee pytest-coverage.txt

      - name: Print Name
        if: ${{ always() }}
        run: |
          echo "This is Python ${{ matrix.python-version }} summary!" >> $GITHUB_STEP_SUMMARY

      - name: Pytest coverage comment
        if: ${{ always() }}
        id: coverageComment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          hide-comment: true
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./results/pytest.xml

      - name: Write job summary
        id: check_status
        if: ${{ always() }}
        run: |
          echo -e ${{ steps.coverageComment.outputs.summaryReport }} >> $GITHUB_STEP_SUMMARY

      - name: Create Coverage Badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.3.0
        with:
          auth: ${{ secrets.TOKEN }}
          gistID: e31fc348a9dea0098de9540dc5961668
          filename: pytest-coverage-${{ matrix.python-version }}.json
          label: Coverage
          message: ${{ steps.coverageComment.outputs.coverage }}
          color: ${{ steps.coverageComment.outputs.color }}
          namedLogo: python

      - name: Create Coverage Badge
        if: github.ref != 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.3.0
        with:
          auth: ${{ secrets.TOKEN }}
          gistID: e31fc348a9dea0098de9540dc5961668
          filename: pytest-coverage-dev-${{ matrix.python-version }}.json
          label: Coverage
          message: ${{ steps.coverageComment.outputs.coverage }}
          color: ${{ steps.coverageComment.outputs.color }}
          namedLogo: python
